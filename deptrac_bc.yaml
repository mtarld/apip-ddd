deptrac:
    paths:
        - ./src

    layers:
        - name: BookStore
          collectors:
              - type: directory
                value: src/BookStore/.*

        - name: Subscription
          collectors:
              - type: directory
                value: src/Subscription/.*

        - name: Shared
          collectors:
              - type: directory
                value: src/Shared/.*

        - name: Vendors
          collectors:
              - { type: classLike, value: ^ApiPlatform\\ }
              - { type: classLike, value: ^Symfony\\ }
              - { type: classLike, value: ^Doctrine\\ }
              - { type: classLike, value: ^Webmozart\\ }
              - { type: classLike, value: ^Psr\\ }
              - { type: classLike, value: ^Mcp\\ }

    ruleset:
        BookStore: [ Shared, Vendors ]
        Subscription: [ Shared, Vendors ]
        Shared: [ Vendors ]
